name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: module_agent
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: module_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U module_agent -d module_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:4.3-management-alpine@sha256:a1a5dd841347af3e32355fd58ac530e831fd394c49e299f862e2fd4ab331cd79
        env:
          RABBITMQ_DEFAULT_USER: module_agent
          RABBITMQ_DEFAULT_PASS: ci_password
          RABBITMQ_DEFAULT_VHOST: module_agent
        ports:
          - 5672:5672

    env:
      DATABASE_URL: postgresql+asyncpg://module_agent:ci_password@localhost:5432/module_agent
      LANGGRAPH_DATABASE_URL: postgresql://module_agent:ci_password@localhost:5432/module_agent
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://module_agent:ci_password@localhost:5672/module_agent
      LITERATURE_QUERY_PLANNER: rule
      LITERATURE_RELEVANCE_SCORER: rule
      LITERATURE_METHOD_EXTRACTOR: off
      SUPERVISOR_POLICY: rule

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run basedpyright src --level error
      - run: uv run alembic upgrade head
      - run: uv run python -m module_agent.cli.setup_langgraph_checkpointer
      - run: uv run pytest -q --cov=module_agent --cov-fail-under=80
      - run: docker build -t module-agent:ci .
